<!DOCTYPE html>
<!--
  config.html —— 插件配置与启动页
  功能：
    1. 从后端加载 DLL 列表，选择要操作的插件；
    2. 编辑启用状态、执行间隔、备注，以及键值对形式的执行参数；
    3. 保存并应用 / 仅加载 / 立即执行 / 卸载。
  所有操作通过 fetch 调用后端 Minimal API（见 Program.cs），不依赖任何前端框架。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>配置与启动</title>
<link rel="stylesheet" href="/style.css" />
<script src="/app.js"></script>
</head>
<body>
<!-- 顶部导航 -->
<nav class="topnav">
    <span class="brand">🔌 插件调度中心</span>
    <a href="/index.html">列表</a>
    <a href="/config.html" class="active">配置</a>
    <a href="/status.html">状态</a>
    <a href="/defaults.html">默认参数</a>
    <a href="/settings.html">告警设置</a>
</nav>

<div class="container">
<h1 class="page-title">配置与启动</h1>
<p class="page-sub">选择插件 → 配置调度/重试/参数 → 保存并应用。</p>

<!-- 插件选择区：下拉选择 DLL，或刷新列表 -->
<div style="margin-bottom:12px">
    <label>选择 DLL：</label>
    <select id="fileSel" onchange="loadConfig()"></select>
    <button class="btn ghost sm" onclick="refreshList()">刷新 DLL 列表</button>
    <span id="fileDesc" style="color:#666"></span>
</div>
<hr />

<!-- 配置编辑区：选中插件后才显示 -->
<div id="configPanel" style="display:none">
    <h3>配置</h3>
    <table cellpadding="4" cellspacing="0">
        <tr><td>启用调度：</td><td><input type="checkbox" id="enabled" /></td></tr>
        <tr><td>备注：</td><td><input type="text" id="notes" style="width:300px" /></td></tr>
    </table>

    <!-- 调度条件（任务启动方式） -->
    <h4>调度条件</h4>
    <table cellpadding="4" cellspacing="0">
        <tr>
            <td>模式：</td>
            <td>
                <select id="schedMode" onchange="onSchedModeChange()">
                    <option value="0">固定间隔</option>
                    <option value="1">Cron 表达式（精确时间）</option>
                    <option value="2">多个精确时间</option>
                    <option value="3">时间段内固定间隔</option>
                </select>
            </td>
        </tr>

        <!-- 固定间隔 / 时间段内间隔 共用 -->
        <tr id="rowInterval"><td>间隔（秒）：</td><td><input type="number" id="interval" value="60" /></td></tr>

        <!-- Cron 表达式 -->
        <tr id="rowCron" style="display:none">
            <td>Cron：</td>
            <td><input type="text" id="cron" style="width:300px" placeholder="如 0 30 14 * * ?" />
                <span style="color:#666">（支持精确到秒，6 段或 5 段）</span></td>
        </tr>

        <!-- 多个精确时间 -->
        <tr id="rowTimes" style="display:none">
            <td valign="top">精确时间：</td>
            <td>
                <div id="timesBox"></div>
                <button onclick="addTime()">+ 添加时间</button>
                <span style="color:#666">（每天在指定时刻各执行一次，如 09:00:00）</span>
            </td>
        </tr>

        <!-- 时间段内固定间隔 -->
        <tr id="rowWindow" style="display:none">
            <td>窗口：</td>
            <td><input type="text" id="winStart" placeholder="09:00" style="width:80px" /> 至
                <input type="text" id="winEnd" placeholder="17:00" style="width:80px" />
                <span style="color:#666">（仅在该时间段内按上面间隔执行）</span></td>
        </tr>
    </table>

    <!-- 失败重试策略 -->
    <h4>失败重试</h4>
    <table cellpadding="4" cellspacing="0">
        <tr>
            <td>策略：</td>
            <td>
                <select id="retryStrategy" onchange="onRetryChange()">
                    <option value="0">不重试</option>
                    <option value="1">固定间隔重试</option>
                    <option value="2">指数退避重试</option>
                    <option value="3">指定次数重试</option>
                </select>
            </td>
        </tr>
        <tr id="rowRetryInterval"><td>重试间隔（秒）：</td><td><input type="number" id="retryInterval" value="60" /></td></tr>
        <tr id="rowMaxRetry"><td>最大重试次数：</td><td><input type="number" id="maxRetry" value="3" /></td></tr>
        <tr id="rowBackoffFactor" style="display:none"><td>退避因子：</td><td><input type="number" id="backoffFactor" value="2" step="0.5" /></td></tr>
    </table>

    <h4>执行参数（键值对）</h4>
    <!-- 参数表：可动态增删行；空参数名会被忽略 -->
    <table id="paramTable" cellpadding="4" cellspacing="0" border="1" style="border-collapse:collapse">
        <thead><tr><th>参数名</th><th>参数值</th><th></th></tr></thead>
        <tbody></tbody>
    </table>
    <button onclick="addParam()">+ 添加参数</button>
    <br /><br />

    <!-- 操作区 -->
    <button onclick="saveConfig()">保存并应用</button>
    <button onclick="loadOnly()">仅加载</button>
    <button onclick="runOnce()">立即执行</button>
    <button onclick="unload()">卸载</button>
    <span id="msg" style="margin-left:10px"></span>
</div>

<script>
// 当前已扫描到的插件列表（用于展示描述）
let files = [];

/**
 * 拉取插件列表填充下拉框，并尽量保持已选中的项。
 */
async function refreshList() {
    const data = await apiGet('/api/plugins');
    files = data || [];
    const sel = document.getElementById('fileSel');
    const prev = sel.value;
    sel.innerHTML = '<option value="">-- 选择插件 --</option>' +
        files.map(f => '<option value="' + esc(f.assemblyFile) + '">' + esc(f.assemblyFile) + '</option>').join('');
    if (prev) sel.value = prev;
    if (sel.value) loadConfig();
}

/**
 * 加载选中插件的当前配置并回填表单。
 */
async function loadConfig() {
    const file = document.getElementById('fileSel').value;
    const msg = document.getElementById('msg');
    const desc = document.getElementById('fileDesc');
    document.getElementById('configPanel').style.display = 'none';
    msg.textContent = '';
    if (!file) return;

    try {
        const cfg = await apiGet('/api/plugins/' + encodeURIComponent(file) + '/config');
        document.getElementById('enabled').checked = cfg.enabled;
        document.getElementById('notes').value = cfg.notes || '';

        // 回填调度配置
        const s = cfg.schedule || {};
        const mode = (s.mode === undefined || s.mode === null) ? 0 : s.mode;
        document.getElementById('schedMode').value = String(mode);
        document.getElementById('interval').value = (s.intervalSeconds || cfg.intervalSeconds || 60);
        document.getElementById('cron').value = s.cron || cfg.cron || '';
        document.getElementById('winStart').value = s.windowStart || '';
        document.getElementById('winEnd').value = s.windowEnd || '';

        // 回填精确时间列表
        const timesBox = document.getElementById('timesBox');
        timesBox.innerHTML = '';
        const times = (s.times && s.times.length) ? s.times : (mode == 2 ? [''] : []);
        times.forEach(t => addTimeRow(t));
        onSchedModeChange();

        // 回填失败重试配置
        const r = cfg.retry || {};
        const rs = (r.strategy === undefined || r.strategy === null) ? 0 : r.strategy;
        document.getElementById('retryStrategy').value = String(rs);
        document.getElementById('retryInterval').value = r.retryIntervalSeconds || 60;
        document.getElementById('maxRetry').value = r.maxRetryCount || 3;
        document.getElementById('backoffFactor').value = r.backoffFactor || 2;
        onRetryChange();

        // 回填参数表
        const tb = document.querySelector('#paramTable tbody');
        tb.innerHTML = '';
        const params = cfg.parameters || {};
        for (const k in params) addParamRow(k, params[k]);
        if (Object.keys(params).length === 0) addParamRow('', '');

        // 展示插件描述
        const st = files.find(f => f.assemblyFile.toLowerCase() === file.toLowerCase());
        desc.textContent = st ? '（' + (st.description || '') + '）' : '';

        document.getElementById('configPanel').style.display = 'block';
    } catch (e) {
        msg.style.color = 'red';
        msg.textContent = '加载配置失败：' + e.message;
    }
}

/** 根据当前选择的调度模式，显示/隐藏对应的配置项。 */
function onSchedModeChange() {
    const mode = parseInt(document.getElementById('schedMode').value) || 0;
    document.getElementById('rowInterval').style.display = (mode == 0 || mode == 3) ? '' : 'none';
    document.getElementById('rowCron').style.display = (mode == 1) ? '' : 'none';
    document.getElementById('rowTimes').style.display = (mode == 2) ? '' : 'none';
    document.getElementById('rowWindow').style.display = (mode == 3) ? '' : 'none';
}

/** 添加一行精确时间输入框。 */
function addTime() {
    addTimeRow('');
}

/** 在精确时间列表末尾追加一行（时间 + 删除按钮）。 */
function addTimeRow(value) {
    const box = document.getElementById('timesBox');
    const row = document.createElement('div');
    row.innerHTML = '<input type="text" class="tk" style="width:120px" value="' + esc(value) + '" placeholder="09:00:00" />' +
        ' <button onclick="this.closest(\'div\').remove()">删</button>';
    box.appendChild(row);
}

/** 收集精确时间列表（忽略空值）。 */
function collectTimes() {
    const times = [];
    document.querySelectorAll('#timesBox .tk').forEach(inp => {
        const v = inp.value.trim();
        if (v) times.push(v);
    });
    return times;
}

/** 收集调度配置为对象（随配置一起提交给后端）。 */
function collectSchedule() {
    const mode = parseInt(document.getElementById('schedMode').value) || 0;
    const s = {
        mode: mode,
        intervalSeconds: parseInt(document.getElementById('interval').value) || 60
    };
    if (mode == 1) s.cron = document.getElementById('cron').value.trim();
    if (mode == 2) s.times = collectTimes();
    if (mode == 3) {
        s.windowStart = document.getElementById('winStart').value.trim();
        s.windowEnd = document.getElementById('winEnd').value.trim();
    }
    return s;
}

/** 根据当前选择的失败重试策略，显示/隐藏对应配置项。 */
function onRetryChange() {
    const rs = parseInt(document.getElementById('retryStrategy').value) || 0;
    // 固定间隔/指数退避/指定次数都用得到"间隔"与"最大次数"；退避因子仅指数退避用
    document.getElementById('rowRetryInterval').style.display = (rs == 1 || rs == 2 || rs == 3) ? '' : 'none';
    document.getElementById('rowMaxRetry').style.display = (rs == 2 || rs == 3) ? '' : 'none';
    document.getElementById('rowBackoffFactor').style.display = (rs == 2) ? '' : 'none';
}

/** 收集失败重试配置为对象；策略为"不重试"时返回 null（不持久化该字段）。 */
function collectRetry() {
    const rs = parseInt(document.getElementById('retryStrategy').value) || 0;
    if (rs == 0) return null;
    const r = {
        strategy: rs,
        retryIntervalSeconds: parseInt(document.getElementById('retryInterval').value) || 60
    };
    if (rs == 2 || rs == 3) {
        r.maxRetryCount = parseInt(document.getElementById('maxRetry').value) || 3;
    }
    if (rs == 2) {
        r.backoffFactor = parseFloat(document.getElementById('backoffFactor').value) || 2;
    }
    return r;
}

/** 添加一行空参数。 */
function addParam() {
    addParamRow('', '');
}

/** 在参数表末尾追加一行（参数名 + 参数值 + 删除按钮）。 */
function addParamRow(key, value) {
    const tb = document.querySelector('#paramTable tbody');
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><input type="text" class="pk" style="width:160px" value="' + esc(key) + '" /></td>' +
        '<td><input type="text" class="pv" style="width:260px" value="' + esc(value) + '" /></td>' +
        '<td><button onclick="this.closest(\'tr\').remove()">删</button></td>';
    tb.appendChild(tr);
}

/** 收集参数表为对象；参数名为空的行被忽略。 */
function collectParams() {
    const params = {};
    document.querySelectorAll('#paramTable tbody tr').forEach(tr => {
        const k = tr.querySelector('.pk').value.trim();
        const v = tr.querySelector('.pv').value;
        if (k) params[k] = v;
    });
    return params;
}

/** 统一的 POST 封装：成功/失败均把结果提示到 #msg。 */
async function doPost(path, body) {
    const msg = document.getElementById('msg');
    msg.style.color = '';
    try {
        const r = await apiPost(path, body);
        msg.style.color = '#16a34a';
        msg.textContent = (r && r.message) || '操作成功';
        return r;
    } catch (e) {
        msg.style.color = 'red';
        msg.textContent = '操作失败：' + e.message;
        return null;
    }
}

/** 保存配置并应用（含启用状态、调度条件、备注、参数）。 */
async function saveConfig() {
    const file = document.getElementById('fileSel').value;
    if (!file) return;
    await doPost('/api/plugins/' + encodeURIComponent(file) + '/config', {
        assemblyFile: file,
        enabled: document.getElementById('enabled').checked,
        intervalSeconds: parseInt(document.getElementById('interval').value) || 60,
        schedule: collectSchedule(),
        retry: collectRetry(),
        notes: document.getElementById('notes').value,
        parameters: collectParams()
    });
}

/** 仅加载插件（不启动调度）。 */
async function loadOnly() {
    const file = document.getElementById('fileSel').value;
    if (!file) return;
    await doPost('/api/plugins/' + encodeURIComponent(file) + '/load');
}

/** 立即执行一次插件。 */
async function runOnce() {
    const file = document.getElementById('fileSel').value;
    if (!file) return;
    await doPost('/api/plugins/' + encodeURIComponent(file) + '/run');
}

/** 卸载插件。 */
async function unload() {
    const file = document.getElementById('fileSel').value;
    if (!file) return;
    await doPost('/api/plugins/' + encodeURIComponent(file) + '/unload');
}

refreshList();
</script>
</div>
</body>
</html>
