<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>运行状态</title>
<link rel="stylesheet" href="/style.css" />
<script src="/app.js"></script>
</head>
<body>
<!-- 顶部导航 -->
<nav class="topnav">
    <span class="brand">🔌 插件调度中心</span>
    <a href="/index.html">列表</a>
    <a href="/config.html">配置</a>
    <a href="/status.html" class="active">状态</a>
    <a href="/defaults.html">默认参数</a>
    <a href="/settings.html">告警设置</a>
</nav>

<div class="container">
    <h1 class="page-title">运行状态</h1>
    <p class="page-sub">每 2 秒自动刷新。点击插件可展开查看执行历史与日志。</p>

    <div class="card">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
            <input type="text" id="search" class="searchbox" placeholder="🔍 搜索 DLL / 名称 / 描述" oninput="applyFilter()" />
            <select id="statusFilter" onchange="applyFilter()">
                <option value="">全部状态</option>
                <option value="Running">运行中</option>
                <option value="Loaded">已加载</option>
                <option value="Faulted">异常</option>
                <option value="Stopped">已停止</option>
                <option value="Discovered">已发现</option>
                <option value="Unloaded">已卸载</option>
            </select>
            <span class="muted small" id="count"></span>
            <span style="flex:1"></span>
            <button class="btn ghost sm" onclick="toggleAll()">全部展开 / 收起</button>
        </div>
        <div id="panel"></div>
    </div>
</div>

<script>
let allPlugins = [];

// 记录当前已展开的插件文件名，用于在 2 秒刷新重渲染时保持展开状态，避免被自动收起
const expandedFiles = new Set();

/**
 * 拉取所有插件状态并渲染（每 2 秒调用）。渲染结果受搜索/状态过滤影响。
 */
async function refresh() {
    try {
        allPlugins = await apiGet('/api/plugins');
        applyFilter();
    } catch (e) {
        document.getElementById('panel').innerHTML = '<p style="color:var(--danger)">加载失败：' + esc(e.message) + '</p>';
    }
}

/** 按搜索词与状态过滤并渲染插件卡片。 */
function applyFilter() {
    const kw = (document.getElementById('search').value || '').trim().toLowerCase();
    const sf = document.getElementById('statusFilter').value;
    const panel = document.getElementById('panel');

    const filtered = allPlugins.filter(p => {
        const hitKw = !kw ||
            p.assemblyFile.toLowerCase().includes(kw) ||
            (p.displayName || '').toLowerCase().includes(kw) ||
            (p.description || '').toLowerCase().includes(kw);
        const hitStatus = !sf || p.status === sf;
        return hitKw && hitStatus;
    });

    document.getElementById('count').textContent = '显示 ' + filtered.length + ' / ' + allPlugins.length + ' 个';
    if (filtered.length === 0) {
        panel.innerHTML = '<p class="muted">没有匹配的插件。</p>';
        return;
    }
    panel.innerHTML = filtered.map(p => renderPlugin(p)).join('');
}

/** 渲染单个插件卡片（默认折叠，点击展开详情）。 */
function renderPlugin(p) {
    const lastOk = p.lastSuccess == null ? '—' : (p.lastSuccess ? '成功' : '失败');
    const history = (p.executionHistory || []).map(h =>
        '<tr><td>' + fmtTime(h.time) + '</td>' +
        '<td style="color:' + (h.success ? 'var(--success)' : 'var(--danger)') + '">' + (h.success ? '成功' : '失败') + '</td>' +
        '<td>' + h.elapsedMs + ' ms</td>' +
        '<td>' + (h.rowsAffected == null ? '—' : h.rowsAffected) + '</td>' +
        '<td>' + esc(h.message) + '</td></tr>'
    ).join('') || '<tr><td colspan="5" class="muted">暂无</td></tr>';

    const recentLogs = (p.logs || []).map(l =>
        '[' + fmtTime(l.time) + '][' + esc(l.level) + '] ' + esc(l.message)
    ).join('\n') || '（暂无近期日志）';

    // 根据"展开集合"决定本卡片默认是否展开（刷新重渲染时保持用户已展开的项）
    const isOpen = expandedFiles.has(p.assemblyFile);
    const bodyCls = 'plugin-body' + (isOpen ? ' open' : '');
    const caretCls = 'caret' + (isOpen ? ' open' : '');

    return '<div class="plugin-card" id="scard_' + esc(p.assemblyFile) + '">' +
        '<div class="plugin-head" onclick="toggleCard(\'' + esc(p.assemblyFile) + '\')">' +
            '<span class="icon">📊</span>' +
            '<span class="info">' +
                '<div class="name">' + esc(p.displayName) +
                    ' <span class="badge" style="background:' + statusColor(p.status) + ';color:#fff">' + statusText(p.status) + '</span></div>' +
                '<div class="meta">' + esc(p.assemblyFile) + ' · 下次 ' + fmtTime(p.nextRunAt) +
                    ' · 成功 <span style="color:var(--success)">' + p.successCount + '</span>' +
                    ' / 失败 <span style="color:var(--danger)">' + p.failCount + '</span>' +
                    (p.retryCount ? ' · 重试 ' + p.retryCount + ' 次' : '') + '</div>' +
            '</span>' +
            '<span class="' + caretCls + '" id="caret_' + esc(p.assemblyFile) + '">▶</span>' +
        '</div>' +
        '<div class="' + bodyCls + '" id="body_' + esc(p.assemblyFile) + '">' +
            '<table class="grid">' +
            '<tr><td style="width:110px">状态说明</td><td>' + esc(p.statusMessage) + '</td></tr>' +
            '<tr><td>启用调度</td><td>' + (p.enabled ? '是' : '否') + '</td></tr>' +
            '<tr><td>上次执行</td><td>' + fmtTime(p.lastRunAt) + '（耗时 ' + p.lastElapsedMs + ' ms）</td></tr>' +
            '<tr><td>上次结果</td><td>' + lastOk + ' - ' + esc(p.lastMessage) + '</td></tr>' +
            '</table>' +
            '<h4 style="margin:14px 0 6px">执行历史（最近 ' + (p.executionHistory || []).length + ' 次）</h4>' +
            '<table class="grid"><thead><tr><th>时间</th><th>结果</th><th>耗时</th><th>行数</th><th>消息</th></tr></thead>' +
            '<tbody>' + history + '</tbody></table>' +
            '<h4 style="margin:14px 0 6px">近期日志（最近 ' + (p.logs || []).length + ' 条）' +
                ' <button class="btn ghost sm" onclick="loadHistory(\'' + esc(p.assemblyFile) + '\', this)">加载完整历史</button></h4>' +
            '<pre style="background:#111;color:#ccc;padding:8px;max-height:180px;overflow:auto;font-size:12px">' + recentLogs + '</pre>' +
            '<div class="historyBox" style="display:none;margin-top:6px"><pre style="background:#0f172a;color:#94a3b8;padding:8px;max-height:300px;overflow:auto;font-size:12px"></pre></div>' +
        '</div>' +
    '</div>';
}

/** 展开/收起插件卡片，并同步记录到"展开集合"以便刷新时保持。 */
function toggleCard(file) {
    const body = document.getElementById('body_' + file);
    const caret = document.getElementById('caret_' + file);
    body.classList.toggle('open');
    caret.classList.toggle('open', body.classList.contains('open'));

    // 同步展开状态：展开则记入集合，收起则移出
    if (body.classList.contains('open')) expandedFiles.add(file);
    else expandedFiles.delete(file);
}

/** 全部展开 / 收起。 */
function toggleAll() {
    const anyOpen = document.querySelector('.plugin-body.open') != null;
    document.querySelectorAll('.plugin-body').forEach(b => b.classList.toggle('open', !anyOpen));
    document.querySelectorAll('.caret').forEach(c => c.classList.toggle('open', !anyOpen));

    // 同步展开集合：全部展开则记录所有，否则清空
    if (anyOpen) expandedFiles.clear();
    else document.querySelectorAll('.plugin-body').forEach(b => expandedFiles.add(b.id.replace('body_', '')));
}

/** 从磁盘加载该插件的历史日志文件并展示。 */
async function loadHistory(file, btn) {
    const box = btn.closest('div').nextElementSibling;
    const pre = box.querySelector('pre');
    try {
        const r = await apiGet('/api/plugins/' + encodeURIComponent(file) + '/history?lines=500');
        pre.textContent = (r.lines && r.lines.length) ? r.lines.join('\n') : '（无历史日志）';
        box.style.display = 'block';
    } catch (e) {
        pre.textContent = '加载失败：' + e.message;
        box.style.display = 'block';
    }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
