<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>插件 DLL 列表</title>
<link rel="stylesheet" href="/style.css" />
<script src="/app.js"></script>
</head>
<body>
<!-- 顶部导航 -->
<nav class="topnav">
    <span class="brand">🔌 插件调度中心</span>
    <a href="/index.html" class="active">列表</a>
    <a href="/config.html">配置</a>
    <a href="/status.html">状态</a>
    <a href="/defaults.html">默认参数</a>
    <a href="/settings.html">告警设置</a>
</nav>

<div class="container">
    <h1 class="page-title">插件 DLL 列表</h1>
    <p class="page-sub">点击任意插件可展开编辑显示名称/描述；点击"重新扫描"发现新放入的 DLL。</p>

    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <strong>共 <span id="count">0</span> 个插件</strong>
            <button class="btn" onclick="refresh()">🔄 重新扫描</button>
        </div>
        <div id="list"></div>
    </div>
</div>

<script>
/**
 * 从后端拉取插件列表并渲染为可展开的卡片。
 * 每张卡片可点击头部展开，编辑该插件的显示名称与描述。
 */
async function refresh() {
    const list = document.getElementById('list');
    list.innerHTML = '<p class="muted">加载中...</p>';
    try {
        const data = await apiGet('/api/plugins');
        document.getElementById('count').textContent = data ? data.length : 0;
        if (!data || data.length === 0) {
            list.innerHTML = '<p class="muted">未扫描到任何 DLL，请点击"重新扫描"。</p>';
            return;
        }
        list.innerHTML = data.map(p => renderCard(p)).join('');
    } catch (e) {
        list.innerHTML = '<p style="color:var(--danger)">加载失败：' + esc(e.message) + '</p>';
    }
}

/** 渲染单张插件卡片（含折叠的编辑区）。 */
function renderCard(p) {
    return '<div class="plugin-card" id="card_' + esc(p.assemblyFile) + '">' +
        '<div class="plugin-head" onclick="toggleCard(\'' + esc(p.assemblyFile) + '\')">' +
            '<span class="icon">📦</span>' +
            '<span class="info">' +
                '<div class="name">' + esc(p.displayName) + '</div>' +
                '<div class="meta">' + esc(p.assemblyFile) + ' · v' + esc(p.version) +
                    ' · <span style="color:' + statusColor(p.status) + '">' + statusText(p.status) + '</span></div>' +
            '</span>' +
            '<span class="caret" id="caret_' + esc(p.assemblyFile) + '">▶</span>' +
        '</div>' +
        '<div class="plugin-body" id="body_' + esc(p.assemblyFile) + '">' +
            '<div><label>显示名称：</label><br/><input type="text" id="dispName_' + esc(p.assemblyFile) + '" value="' + esc(p.displayName) + '" style="width:100%" /></div>' +
            '<div style="margin-top:10px"><label>显示描述：</label><br/><textarea id="dispDesc_' + esc(p.assemblyFile) + '" style="width:100%;height:60px">' + esc(p.description || '') + '</textarea></div>' +
            '<div style="margin-top:12px">' +
                '<button class="btn sm success" onclick="saveDisplay(\'' + esc(p.assemblyFile) + '\')">保存显示信息</button>' +
                '<span class="msg" id="msg_' + esc(p.assemblyFile) + '"></span>' +
            '</div>' +
        '</div>' +
    '</div>';
}

/** 展开/折叠插件卡片。 */
function toggleCard(file) {
    const body = document.getElementById('body_' + file);
    const caret = document.getElementById('caret_' + file);
    const open = body.classList.toggle('open');
    caret.classList.toggle('open', open);
}

/** 保存该插件的显示名称/描述覆盖。 */
async function saveDisplay(file) {
    const name = document.getElementById('dispName_' + file).value.trim();
    const desc = document.getElementById('dispDesc_' + file).value.trim();
    const msg = document.getElementById('msg_' + file);
    try {
        await apiPost('/api/plugins/' + encodeURIComponent(file) + '/display', { displayName: name, description: desc });
        msg.className = 'msg ok';
        msg.textContent = '已保存';
        refresh(); // 刷新以更新列表显示
    } catch (e) {
        msg.className = 'msg err';
        msg.textContent = e.message;
    }
}

refresh();
</script>
</body>
</html>
